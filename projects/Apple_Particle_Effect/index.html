<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Particle Effect</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%); font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
#particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
.particle { position: absolute; border-radius: 50%; background: linear-gradient(to bottom, #4C4C4C, #F0F0F0); opacity: 0.8; animation: float 3s ease-out forwards; pointer-events: none; }
@keyframes float { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(100px, 100px); opacity: 0; } }
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const particlesContainer = document.getElementById('particles');
  for (let i = 0; i < 50; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = `${Math.random() * 100}%`;
    particle.style.top = `${Math.random() * 100}%`;
    particle.style.width = `${Math.random() * 2 + 1}px`;
    particle.style.height = `${Math.random() * 2 + 1}px`;
    particle.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
    particlesContainer.appendChild(particle);
  }
});
</script>
</head>
<body>
<div id="particles"></div>
</body>
</html>
