<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页 - 夜间模式与音乐播放器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>我的主页</h1>
        <button id="themeToggle" class="theme-toggle" aria-label="切换夜间模式">🌙</button>
    </header>

    <main class="content">
        <section class="hero">
            <h2>欢迎来到我的主页</h2>
            <p>这是一个支持夜间模式和音乐播放器的示例页面。</p>
        </section>

        <section class="music-player">
            <h3>音乐播放器</h3>
            <div class="player-controls">
                <button id="playBtn" class="control-btn">▶</button>
                <button id="pauseBtn" class="control-btn">⏸</button>
                <button id="stopBtn" class="control-btn">⏹</button>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
            </div>
            <audio id="audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 我的主页</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
