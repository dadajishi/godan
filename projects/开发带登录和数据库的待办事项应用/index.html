<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项应用</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 登录界面 -->
        <div id="login-container" class="container">
            <h2>登录</h2>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="用户名" required>
                <input type="password" id="login-password" placeholder="密码" required>
                <button type="submit">登录</button>
            </form>
            <p id="login-error" class="error"></p>
            <p>没有账号？<a href="#" id="show-register">注册</a></p>
        </div>

        <!-- 注册界面 -->
        <div id="register-container" class="container" style="display:none;">
            <h2>注册</h2>
            <form id="register-form">
                <input type="text" id="register-username" placeholder="用户名" required>
                <input type="password" id="register-password" placeholder="密码" required>
                <button type="submit">注册</button>
            </form>
            <p id="register-error" class="error"></p>
            <p>已有账号？<a href="#" id="show-login">登录</a></p>
        </div>

        <!-- 待办事项界面 -->
        <div id="todo-container" class="container" style="display:none;">
            <h2>待办事项</h2>
            <div id="user-info">
                <span id="current-user"></span>
                <button id="logout-btn">退出登录</button>
            </div>
            <form id="todo-form">
                <input type="text" id="todo-input" placeholder="添加新待办事项" required>
                <button type="submit">添加</button>
            </form>
            <ul id="todo-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
