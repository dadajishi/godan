<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能待办事项应用</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>📝 智能待办事项</h1>
            <p class="subtitle">高效管理你的每一天</p>
        </header>
        
        <div class="input-area">
            <input type="text" id="taskInput" placeholder="输入新任务..." maxlength="100">
            <select id="prioritySelect">
                <option value="low">🟢 低优先级</option>
                <option value="medium" selected>🟡 中优先级</option>
                <option value="high">🔴 高优先级</option>
            </select>
            <button id="addBtn">添加</button>
        </div>
        
        <div class="filter-area">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="active">进行中</button>
            <button class="filter-btn" data-filter="completed">已完成</button>
        </div>
        
        <ul id="taskList"></ul>
        
        <div class="stats">
            <span id="taskCount">0</span> 个任务 · <span id="completedCount">0</span> 已完成
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
