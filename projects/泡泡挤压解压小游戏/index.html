<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泡泡挤压解压小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #fff;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            margin-bottom: 20px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 15px;
        }
        .stat-item {
            color: #fff;
            font-size: 1.2rem;
        }
        .stat-item span {
            font-weight: bold;
            font-size: 1.5rem;
            display: block;
            color: #ffd700;
        }
        #gameCanvas {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            display: block;
            margin: 0 auto 20px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.3);
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(238, 90, 36, 0.4);
            letter-spacing: 1px;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(238, 90, 36, 0.6);
        }
        button:active {
            transform: translateY(0);
        }
        #resetBtn {
            background: linear-gradient(135deg, #4ecdc4, #44bd9e);
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.4);
        }
        #resetBtn:hover {
            box-shadow: 0 8px 20px rgba(78, 205, 196, 0.6);
        }
        .message {
            color: #ffd700;
            font-size: 1.2rem;
            margin-top: 15px;
            min-height: 30px;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }
        @media (max-width: 500px) {
            .game-container {
                padding: 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
            #gameCanvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🫧 泡泡挤压</h1>
        <p class="subtitle">点击泡泡，享受解压时刻</p>
        <div class="stats">
            <div class="stat-item">得分 <span id="score">0</span></div>
            <div class="stat-item">剩余 <span id="remaining">0</span></div>
            <div class="stat-item">时间 <span id="timer">30</span>s</div>
        </div>
        <canvas id="gameCanvas" width="500" height="400"></canvas>
        <div class="controls">
            <button id="startBtn">开始游戏</button>
            <button id="resetBtn">重置</button>
        </div>
        <div class="message" id="message">点击开始，释放压力！</div>
    </div>

    <script>
        // ===== 游戏配置 =====
        const CONFIG = {
            bubbleCount: 15,
            gameTime: 30, // 秒
            bubbleRadius: 25,
            colors: [
                '#ff6b6b', '#ffa502', '#2ed573', '#1e90ff',
                '#ff6348', '#7bed9f', '#70a1ff', '#ff4757',
                '#eccc68', '#a29bfe'
            ]
        };

        // ===== 游戏状态 =====
        let bubbles = [];
        let score = 0;
        let timeLeft = CONFIG.gameTime;
        let gameRunning = false;
        let gameTimer = null;
        let particles = []; // 粒子特效

        // ===== DOM 元素 =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const remainingEl = document.getElementById('remaining');
        const timerEl = document.getElementById('timer');
        const messageEl = document.getElementById('message');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ===== 工具函数 =====
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function randomColor() {
            return CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
        }

        // ===== 泡泡生成 =====
        function createBubble() {
            const radius = CONFIG.bubbleRadius;
            const x = random(radius, canvas.width - radius);
            const y = random(radius, canvas.height - radius);
            return {
                x: x,
                y: y,
                radius: radius,
                color: randomColor(),
                scale: 1, // 用于挤压动画
                targetScale: 1,
                popping: false,
                popProgress: 0
            };
        }

        function generateBubbles() {
            bubbles = [];
            for (let i = 0; i < CONFIG.bubbleCount; i++) {
                bubbles.push(createBubble());
            }
        }

        // ===== 粒子特效 =====
        function createParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                const angle = random(0, Math.PI * 2);
                const speed = random(2, 6);
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: random(2, 5),
                    color: color,
                    life: 1,
                    decay: random(0.02, 0.05)
                });
            }
        }

        // ===== 更新粒子 =====
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; // 重力
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // ===== 绘制 =====
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制背景网格（增加视觉趣味）
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 30) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 30) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // 绘制泡泡
            bubbles.forEach(bubble => {
                if (bubble.popping) {
                    // 挤压动画：逐渐缩小并消失
                    bubble.popProgress += 0.1;
                    const scale = 1 - bubble.popProgress;
                    if (scale <= 0) return;
                    ctx.save();
                    ctx.translate(bubble.x, bubble.y);
                    ctx.scale(scale, scale);
                    ctx.globalAlpha = scale;
                    drawBubble(bubble);
                    ctx.restore();
                } else {
                    // 正常绘制，带轻微浮动
                    const floatY = Math.sin(Date.now() / 1000 + bubble.x) * 3;
                    ctx.save();
                    ctx.translate(bubble.x, bubble.y + floatY);
                    drawBubble(bubble);
                    ctx.restore();
                }
            });

            // 绘制粒子
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function drawBubble(bubble) {
            // 绘制半透明圆形
            ctx.beginPath();
            ctx.arc(0, 0, bubble.radius, 0, Math.PI * 2);
            ctx.fillStyle = bubble.color;
            ctx.globalAlpha = 0.7;
            ctx.fill();
            ctx.globalAlpha = 1;

            // 绘制高光
            ctx.beginPath();
            ctx.arc(-5, -5, bubble.radius * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.fill();

            // 绘制边框
            ctx.beginPath();
            ctx.arc(0, 0, bubble.radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // ===== 游戏逻辑 =====
        function startGame() {
            if (gameRunning) return;
            gameRunning = true;
            score = 0;
            timeLeft = CONFIG.gameTime;
            particles = [];
            generateBubbles();
            updateUI();
            messageEl.textContent = '点击泡泡！';

            // 启动计时器
            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                timeLeft--;
                updateUI();
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // 动画循环
            if (!animationId) {
                animate();
            }
        }

        let animationId = null;

        function animate() {
            updateParticles();
            draw();
            animationId = requestAnimationFrame(animate);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameTimer);
            gameTimer = null;
            messageEl.textContent = `游戏结束！得分：${score}`;
            // 停止动画
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            // 清空泡泡
            bubbles = [];
            particles = [];
            draw();
        }

        function resetGame() {
            // 停止游戏
            if (gameRunning) {
                gameRunning = false;
                clearInterval(gameTimer);
                gameTimer = null;
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            // 重置状态
            score = 0;
            timeLeft = CONFIG.gameTime;
            bubbles = [];
            particles = [];
            updateUI();
            messageEl.textContent = '点击开始，释放压力！';
            draw();
        }

        function updateUI() {
            scoreEl.textContent = score;
            remainingEl.textContent = bubbles.filter(b => !b.popping).length;
            timerEl.textContent = timeLeft;
        }

        // ===== 点击事件 =====
        canvas.addEventListener('click', (e) => {
            if (!gameRunning) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            // 从后往前检测，优先点击最上层的泡泡
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                if (b.popping) continue;
                const dx = mouseX - b.x;
                const dy = mouseY - b.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist <= b.radius) {
                    // 点击成功
                    b.popping = true;
                    b.popProgress = 0;
                    score++;
                    createParticles(b.x, b.y, b.color);
                    // 播放挤压音效（可选，这里用视觉反馈）
                    updateUI();
                    // 检查是否全部消除
                    const remaining = bubbles.filter(b => !b.popping).length;
                    if (remaining === 0) {
                        // 全部消除，加分奖励
                        score += 5;
                        messageEl.textContent = '太棒了！全部消除！+5分';
                        // 重新生成新泡泡
                        setTimeout(() => {
                            generateBubbles();
                            updateUI();
                            messageEl.textContent = '新泡泡来了！';
                        }, 500);
                    }
                    break;
                }
            }
        });

        // ===== 按钮事件 =====
        startBtn.addEventListener('click', startGame);
        resetBtn.addEventListener('click', resetGame);

        // ===== 初始化 =====
        function init() {
            generateBubbles();
            draw();
            updateUI();
        }

        init();
    </script>
</body>
</html>
