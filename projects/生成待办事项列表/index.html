<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项列表</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>待办事项列表</h1>
    <div class="input-area">
      <input type="text" id="todo-input" placeholder="输入新待办事项...">
      <button id="add-btn">添加</button>
    </div>
    <ul id="todo-list"></ul>
    <div class="footer">
      <span id="item-count">0 项待办</span>
      <button id="clear-completed">清除已完成</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
