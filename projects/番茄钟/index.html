<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🍅 番茄钟</h1>
        <div class="timer">
            <div class="circle">
                <svg viewBox="0 0 200 200">
                    <circle class="progress-bg" cx="100" cy="100" r="90"/>
                    <circle class="progress" id="progress" cx="100" cy="100" r="90"/>
                </svg>
                <div class="time" id="timeDisplay">25:00</div>
            </div>
        </div>
        <div class="controls">
            <button id="startBtn" class="btn primary">开始</button>
            <button id="resetBtn" class="btn secondary">重置</button>
        </div>
        <div class="mode-switch">
            <button class="mode-btn active" data-mode="work">专注</button>
            <button class="mode-btn" data-mode="short">短休</button>
            <button class="mode-btn" data-mode="long">长休</button>
        </div>
        <div class="settings">
            <label>专注 <input type="number" id="workTime" value="25" min="1" max="60"> 分钟</label>
            <label>短休 <input type="number" id="shortTime" value="5" min="1" max="30"> 分钟</label>
            <label>长休 <input type="number" id="longTime" value="15" min="1" max="60"> 分钟</label>
        </div>
        <div class="session-count">已完成 <span id="sessionCount">0</span> 个番茄</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
