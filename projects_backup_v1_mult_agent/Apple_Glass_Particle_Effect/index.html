<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Glass Particle Effect</title>
  <style>
    .glass-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      overflow: hidden;
      z-index: 1;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 100%);
      opacity: 0.7;
      width: 5px;
      height: 5px;
      animation: float 15s infinite;
      z-index: 1;
    }
    @keyframes float {
      0% {
        transform: translate(0, 0);
        opacity: 0.7;
      }
      50% {
        transform: translate(30px, 20px);
        opacity: 0.3;
      }
      100% {
        transform: translate(0, 0);
        opacity: 0.7;
      }
    }
  </style>
</head>
<body>
  <div class="glass-container">
    <div class="particles"></div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const particlesContainer = document.querySelector('.particles');
      const particleCount = 50;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.width = `${Math.random() * 8 + 5}px`;
        particle.style.height = `${Math.random() * 8 + 5}px`;
        particle.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.top = `${Math.random() * 100}%`;
        particle.style.opacity = `${Math.random() * 0.5 + 0.3}`;
        particlesContainer.appendChild(particle);
      }

      let animationFrameId;
      function animate() {
        const particles = document.querySelectorAll('.particle');
        particles.forEach(particle => {
          const x = parseFloat(particle.style.left);
          const y = parseFloat(particle.style.top);
          particle.style.left = `${x + (Math.random() * 2 - 1)}px`;
          particle.style.top = `${y + (Math.random() * 2 - 1)}px`;
          particle.style.opacity = `${parseFloat(particle.style.opacity) - 0.01}`;
          if (parseFloat(particle.style.opacity) <= 0) {
            particle.remove();
          }
        });
        animationFrameId = requestAnimationFrame(animate);
      }
      animate();
    });
  </script>
</body>
</html>
