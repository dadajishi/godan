<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise 可视化演示</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Promise 状态可视化</h1>
        <div class="promise-box" id="promiseBox">
            <div class="promise-status" id="promiseStatus">pending</div>
            <div class="promise-value" id="promiseValue">undefined</div>
        </div>
        <div class="controls">
            <button id="btnResolve">resolve('成功')</button>
            <button id="btnReject">reject('失败')</button>
            <button id="btnReset">重置</button>
        </div>
        <div class="log" id="log"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
