<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟 - 深色模式</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍅 番茄钟</h1>
            <button id="themeToggle" class="theme-toggle" aria-label="切换深色模式">🌙</button>
        </header>
        <main>
            <div class="timer-display">
                <span id="minutes">25</span>:<span id="seconds">00</span>
            </div>
            <div class="controls">
                <button id="startBtn">开始</button>
                <button id="resetBtn">重置</button>
            </div>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="work">工作</button>
                <button class="mode-btn" data-mode="shortBreak">短休息</button>
                <button class="mode-btn" data-mode="longBreak">长休息</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
