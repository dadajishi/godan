<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗地主</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="top-player">
            <div class="player-info">
                <span class="player-name">电脑1</span>
                <span class="player-cards-count" id="top-count">17</span>
            </div>
            <div class="cards" id="top-cards"></div>
        </div>
        <div id="middle-area">
            <div id="left-player">
                <div class="player-info">
                    <span class="player-name">电脑2</span>
                    <span class="player-cards-count" id="left-count">17</span>
                </div>
                <div class="cards" id="left-cards"></div>
            </div>
            <div id="table-area">
                <div id="last-play">
                    <div class="cards" id="last-cards"></div>
                </div>
                <div id="game-status">等待开始</div>
                <div id="bottom-player">
                    <div class="player-info">
                        <span class="player-name">你</span>
                        <span class="player-cards-count" id="bottom-count">17</span>
                    </div>
                    <div class="cards" id="bottom-cards"></div>
                </div>
            </div>
        </div>
        <div id="control-panel">
            <button id="btn-start">开始游戏</button>
            <button id="btn-play" disabled>出牌</button>
            <button id="btn-pass" disabled>不出</button>
            <button id="btn-hint" disabled>提示</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
