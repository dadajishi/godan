<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🍅 番茄钟</h1>
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="controls">
            <button id="startBtn" class="btn primary">开始</button>
            <button id="pauseBtn" class="btn secondary" disabled>暂停</button>
            <button id="resetBtn" class="btn secondary">重置</button>
        </div>
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="work">工作 25分</button>
            <button class="mode-btn" data-mode="shortBreak">短休 5分</button>
            <button class="mode-btn" data-mode="longBreak">长休 15分</button>
        </div>
        <div class="status" id="status">准备开始</div>
        <div class="session-count">已完成番茄: <span id="sessionCount">0</span></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
